# Example configuration for the email server
# Copy this file to config.yaml and update with your settings

# Microsoft Graph API settings
microsoft:
  enabled: true
  client_id: "your_client_id"
  client_secret: "your_client_secret"
  tenant_id: "your_tenant_id"
  redirect_uri: "http://localhost:8000/auth/microsoft/callback"
  scopes:
    - "https://graph.microsoft.com/Mail.ReadWrite"
    - "https://graph.microsoft.com/Mail.Send"
    - "https://graph.microsoft.com/Calendars.ReadWrite"
  additional_settings:
    api_version: "v1.0"
    timeout: 30

# Gmail API settings
gmail:
  enabled: true
  credentials_path: "path/to/credentials.json"
  redirect_uri: "http://localhost:8000/auth/gmail/callback"
  scopes:
    - "https://www.googleapis.com/auth/gmail.readonly"
    - "https://www.googleapis.com/auth/gmail.send"
  additional_settings:
    batch_size: 100
    timeout: 30

# General settings
token_storage_path: "tokens"
log_level: "INFO"

# External read-only API settings (see docs/external-message-api-spec.md).
# Disabled by default. Each entry in `tokens` authorizes one external
# consumer to call BriefKorb's external-facing API (e.g. GET /api/messages);
# `label` is free text used only for logging which consumer made a call --
# it grants no permissions of its own. Add an entry per consumer; there is
# no limit to how many may be registered.
external_api:
  enabled: false
  tokens: []
  # tokens:
  #   - token: "replace-with-a-long-random-secret"
  #     label: "some-consumer" 